name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend test suite
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          OPENAI_API_KEY: dummy-key-for-tests
        run: pytest tests src/__tests__

  frontend:
    name: Frontend lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  publish-images:
    name: Build & push Docker images to GHCR
    # Only on merge to main, and only once both test jobs above pass --
    # deployment itself stays manual (see DEPLOY.md); this job just
    # publishes the images a human later pulls on the NAS.
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aigm-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/aigm-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api.jdr.yvenat.eu
            VITE_WS_URL=wss://api.jdr.yvenat.eu
          tags: |
            ghcr.io/${{ github.repository_owner }}/aigm-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/aigm-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
